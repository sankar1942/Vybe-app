<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vybe - v19</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background Glow Effects -->
    <div class="bg-glow top-glow"></div>
    <div class="bg-glow bottom-glow"></div>

    <!-- Splash / Login Screen -->
    <div id="splash-screen" class="screen active">
        <div class="splash-content liquid-glass-container">
            <h1 class="logo glow-text">Vybe</h1>
            <p class="tagline">Feel the Wave</p>
            <button id="get-started-btn" class="glass-btn liquid-btn">Get Started</button>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="main-app" class="screen hidden">
        <!-- Top Glass Header -->
        <header class="glass-header">
            <h2 class="header-title">Vybe</h2>
            <div class="header-icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-regular fa-bell"></i>
                <i class="fa-regular fa-message"></i>
            </div>
        </header>

        <!-- Liquid Stories -->
        <div class="stories-wrapper">
            <div class="liquid-story add-story"><i class="fa-solid fa-plus"></i></div>
            <div class="liquid-story active-story" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100');"></div>
            <div class="liquid-story" style="background-image: url('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100');"></div>
            <div class="liquid-story" style="background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100');"></div>
            <div class="liquid-story" style="background-image: url('https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100');"></div>
        </div>

        <!-- Scrollable Feed -->
        <main id="feed-tab" class="tab-content active-tab">
            <!-- Liquid Post 1 -->
            <article class="liquid-post-card">
                <div class="post-header">
                    <div class="post-avatar liquid-shape" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100');"></div>
                    <span class="post-username">@travel_vibe</span>
                </div>
                <div class="post-media liquid-media" style="background-image: url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=600');"></div>
                <div class="post-actions">
                    <i class="fa-solid fa-heart active-icon"></i>
                    <i class="fa-regular fa-comment"></i>
                    <i class="fa-regular fa-paper-plane"></i>
                </div>
            </article>

            <!-- Liquid Post 2 -->
            <article class="liquid-post-card">
                <div class="post-header">
                    <div class="post-avatar liquid-shape" style="background-image: url('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100');"></div>
                    <span class="post-username">@nature_escapes</span>
                </div>
                <div class="post-media liquid-media" style="background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600');"></div>
                <div class="post-actions">
                    <i class="fa-regular fa-heart"></i>
                    <i class="fa-regular fa-comment"></i>
                    <i class="fa-regular fa-paper-plane"></i>
                </div>
            </article>
        </main>

        <!-- Profile Tab (Hidden by default) -->
        <main id="profile-tab" class="tab-content hidden">
            <div class="profile-header liquid-glass-container">
                <div class="profile-avatar liquid-shape"></div>
                <h3 class="profile-name">@username</h3>
                <p class="profile-bio">Digital Explorer</p>
                <div class="profile-stats">
                    <div class="stat"><span class="stat-num">3</span><span class="stat-label">Posts</span></div>
                    <div class="stat"><span class="stat-num">12</span><span class="stat-label">Followers</span></div>
                    <div class="stat"><span class="stat-num">10</span><span class="stat-label">Following</span></div>
                </div>
                <div class="profile-actions">
                    <button class="glass-btn small-btn">Edit Profile</button>
                    <button class="glass-btn small-btn">Message</button>
                </div>
            </div>
            
            <div class="profile-grid">
                <!-- Grid items with liquid borders -->
                <div class="grid-item liquid-shape" style="background-image: url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=300');"></div>
                <div class="grid-item liquid-shape" style="background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=300');"></div>
                <div class="grid-item liquid-shape" style="background-image: url('https://images.unsplash.com/photo-1504608524841-42fe6f032b4b?w=300');"></div>
            </div>
        </main>

        <!-- Floating Liquid Bottom Navigation -->
        <nav class="liquid-bottom-nav">
            <i class="fa-solid fa-house nav-icon active-nav" data-target="feed-tab"></i>
            <i class="fa-regular fa-compass nav-icon"></i>
            <div class="nav-add-btn liquid-shape">
                <i class="fa-solid fa-plus"></i>
            </div>
            <i class="fa-regular fa-bell nav-icon"></i>
            <i class="fa-regular fa-user nav-icon" data-target="profile-tab"></i>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="cloudinary.js"></script>
    <script src="features.js"></script>
    <script src="app.js"></script>
</body>
</html>
